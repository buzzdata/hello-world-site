<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #74ebd5, #9face6);
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }
    h1 {
      margin: 0;
      color: #333;
      font-size: 42px;
    }
    p {
      color: #666;
      margin-top: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World 🌍</h1>
    <p>My first free website on GitHub Pages</p>
  </div>
</body>
</html>
